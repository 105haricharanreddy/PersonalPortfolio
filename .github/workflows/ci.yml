name: Portfolio Unit Tests

# Run tests whenever code is pushed or a pull request is created
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Email Validation Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the GitHub repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Run unit tests
      - name: Run Unit Tests
        run: npm test